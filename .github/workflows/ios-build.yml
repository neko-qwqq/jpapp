name: iOS Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build AoiJapanese
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: List Simulators
        run: xcrun simctl list devices available

      - name: Build
        working-directory: AoiJapanese
        run: |
          set +e
          xcodebuild \
            -project AoiJapanese.xcodeproj \
            -target AoiJapanese \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ../xcodebuild.log
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            echo "::group::Swift and Xcode errors"
            grep -nE "(/[^ ]+\\.swift:[0-9]+:[0-9]+: error:|error:|BUILD FAILED|The following build commands failed)" ../xcodebuild.log || true
            echo "::endgroup::"

            echo "::group::Last 250 xcodebuild log lines"
            tail -n 250 ../xcodebuild.log
            echo "::endgroup::"
          fi

          exit "$status"

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
