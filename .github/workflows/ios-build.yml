name: iOS Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build AoiJapanese
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: List Simulators
        run: xcrun simctl list devices available

      - name: Build
        working-directory: AoiJapanese
        run: |
          set -o pipefail
          xcodebuild \
            -project AoiJapanese.xcodeproj \
            -target AoiJapanese \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
