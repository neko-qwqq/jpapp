name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "App Store Connect Bundle ID, for example com.nekoqwqq.aoijapanese"
        required: true
        default: "com.nekoqwqq.aoijapanese"
      marketing_version:
        description: "App version shown in TestFlight"
        required: true
        default: "1.0"
      upload_to_testflight:
        description: "Upload the signed IPA to TestFlight"
        required: true
        type: boolean
        default: true

jobs:
  archive:
    name: Archive and Upload TestFlight IPA
    runs-on: macos-15

    env:
      PROJECT_DIR: AoiJapanese
      PROJECT_FILE: AoiJapanese.xcodeproj
      TARGET_NAME: AoiJapanese
      ARCHIVE_PATH: ${{ runner.temp }}/AoiJapanese.xcarchive
      EXPORT_PATH: ${{ runner.temp }}/AoiJapaneseExport
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Validate required secrets
        run: |
          set -euo pipefail

          missing=0
          for name in \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_BASE64
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Prepare App Store Connect API key
        run: |
          set -euo pipefail

          KEY_DIR="$RUNNER_TEMP/private_keys"
          ASC_KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          mkdir -p "$KEY_DIR" "$HOME/.appstoreconnect/private_keys"
          python3 - "$ASC_KEY_PATH" <<'PY'
          import base64
          import os
          import sys

          output_path = sys.argv[1]
          raw_value = os.environ["APP_STORE_CONNECT_API_KEY_BASE64"].strip()
          with open(output_path, "wb") as output:
              output.write(base64.b64decode(raw_value))
          PY
          chmod 600 "$ASC_KEY_PATH"
          cp "$ASC_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive signed app
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          xcodebuild \
            -project "$PROJECT_FILE" \
            -target "$TARGET_NAME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ inputs.bundle_id }}" \
            MARKETING_VERSION="${{ inputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Automatic \
            archive 2>&1 | tee ../xcodebuild-testflight-archive.log

      - name: Create export options
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          set -o pipefail

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            2>&1 | tee xcodebuild-testflight-export.log

          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -type f | head -n 1)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error::IPA was not exported."
            find "$EXPORT_PATH" -maxdepth 3 -type f || true
            exit 1
          fi

          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AoiJapanese-TestFlight-IPA
          path: ${{ env.IPA_PATH }}

      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        run: |
          set -euo pipefail

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-testflight-logs
          path: |
            xcodebuild-testflight-export.log
            xcodebuild-testflight-archive.log
