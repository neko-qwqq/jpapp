<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f36f9f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="日语自习" />
    <title>日语自习</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/icon.svg" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="petal-layer" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </div>

      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">あ</span>
          <div>
            <p class="eyebrow">私の日本語ノート</p>
            <h1 id="screen-title">练习</h1>
          </div>
        </div>
        <button class="icon-button" id="install-button" data-action="install" type="button" aria-label="安装到主屏幕">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14" />
          </svg>
        </button>
      </header>

      <main class="screen-stack">
        <section class="screen is-active" data-screen="home" id="screen-home"></section>
        <section class="screen" data-screen="kana" id="screen-kana"></section>
        <section class="screen" data-screen="n5" id="screen-n5"></section>
        <section class="screen" data-screen="n4" id="screen-n4"></section>
        <section class="screen" data-screen="n3" id="screen-n3"></section>
      </main>

      <nav class="tabbar" aria-label="主导航">
        <button class="tab-item is-active" data-target="home" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20H5v-8.5Z" /></svg>
          <span>练习</span>
        </button>
        <button class="tab-item" data-target="kana" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10" /></svg>
          <span>五十音</span>
        </button>
        <button class="tab-item" data-target="n5" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14H5zM9 9h6M9 13h6" /></svg>
          <span>N5</span>
        </button>
        <button class="tab-item" data-target="n4" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-3-6 3V4Z" /></svg>
          <span>N4</span>
        </button>
        <button class="tab-item" data-target="n3" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M5 8h14M7 16h10" /></svg>
          <span>N3</span>
        </button>
      </nav>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
